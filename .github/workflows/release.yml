name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.17.8-1)'
        required: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      skip-kernel-test: true
  release:
    needs: [build]
    runs-on: ubuntu-26.04
  
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      
      - name: Create Draft Release
        # Create a draft release that should be tested / promoted by a human.
        uses: softprops/action-gh-release@v3
        id: create_release
        with:
          draft: true
          prerelease: true
          name: Armbian MorseMicro ${{ github.event.inputs.version }}
          tag_name: ${{ github.event.inputs.version }}
          files: artifacts/*.deb
